# OpenSSF Scorecards - Security health metrics for the repository
# Checks security best practices and generates a badge

name: Scorecards

on:
  schedule:
    - cron: '30 1 * * 0'  # Weekly on Sunday at 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions: read-all  # Default read access for all scopes

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # Upload SARIF results to code-scanning dashboard
      id-token: write         # Publish results and sign attestations
      contents: read          # Checkout repository code
      actions: read           # Analyze workflow security practices

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # Publish results to enable badge

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
