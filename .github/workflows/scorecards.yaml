# OpenSSF Scorecards - Security health metrics for the repository
# Checks security best practices and generates a badge

name: Scorecards

on:
  schedule:
    - cron: '30 1 * * 0'  # Weekly on Sunday at 01:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions: read-all  # Default read access for all scopes

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # Upload SARIF results to code-scanning dashboard
      id-token: write         # Publish results and sign attestations
      contents: read          # Checkout repository code
      actions: read           # Analyze workflow security practices

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # Publish results to enable badge

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e  # v4.35.4
        with:
          sarif_file: results.sarif
